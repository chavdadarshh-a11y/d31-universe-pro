name: Deploy BETA (features-beta → gh-pages/beta/)
# Beta only: builds branch features-beta into the /beta/ subfolder of gh-pages and keeps every other file
# (the live app at the root and /preview/ stay exactly as they are). Own base path, own service-worker
# cache channel ('d31-beta-…'), own localStorage copy — see src/lib/betaIsolation.ts.
on:
  push:
    branches: [features-beta]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: beta-deploy
  cancel-in-progress: true
jobs:
  beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore binary assets (stored as base64 text)
        run: |
          cd binary-assets
          find . -name '*.b64' | while read f; do t="../${f#./}"; t="${t%.b64}"; mkdir -p "$(dirname "$t")"; base64 -d "$f" > "$t"; done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUBPATH: beta   # site.config.json siteUrl + beta/ (the knowledge feed stays at the site root)
          VITE_BETA: '1'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOATCOUNTER: ${{ secrets.VITE_GOATCOUNTER }}
          VITE_OWNER_EMAILS: ${{ secrets.VITE_OWNER_EMAILS }}
      - name: Knowledge video previews (reuse the ones already cut for the site; never blocks a deploy)
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          SITE=$(node -p "require('./site.config.json').siteUrl")
          curl -fsSL "${SITE}knowledge/posts.json" -o /tmp/posts.json || cp public/knowledge/posts.json /tmp/posts.json
          # reuse previews already on the beta site; only new videos are cut
          node scripts/make-previews.mjs --posts /tmp/posts.json --out dist/knowledge/previews --reuse "${SITE}beta/knowledge/previews/"
      - name: Beta service-worker channel + no indexing
        run: |
          sed -i "s/^const VERSION = '[^']*'/const VERSION = 'd31-beta-v4.5.0-${GITHUB_SHA::7}'/" dist/sw.js
          grep -m1 "const VERSION" dist/sw.js
          # live root is the only indexable copy: beta pages say noindex (canonical still points to live)
          sed -i 's#<meta name="robots" content="[^"]*"#<meta name="robots" content="noindex, nofollow"#' dist/index.html dist/privacy.html
          grep -q 'content="noindex, nofollow"' dist/index.html || sed -i 's#<head>#<head><meta name="robots" content="noindex, nofollow">#' dist/index.html
          grep -q 'content="noindex, nofollow"' dist/privacy.html || sed -i 's#<head>#<head><meta name="robots" content="noindex, nofollow">#' dist/privacy.html
          sed -i 's/"name": "D31.UNIVERSE"/"name": "D31.UNIVERSE BETA"/; s/"short_name": "D31"/"short_name": "D31 BETA"/' dist/manifest.webmanifest
          touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: beta
          keep_files: true
