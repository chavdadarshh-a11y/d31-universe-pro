name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore binary assets (stored as base64 text)
        run: |
          cd binary-assets
          find . -name '*.b64' | while read f; do t="../${f#./}"; t="${t%.b64}"; mkdir -p "$(dirname "$t")"; base64 -d "$f" > "$t"; done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (units, post order, logic) — a failure stops the deploy
        run: npm test
        env:
          NODE_OPTIONS: --experimental-strip-types
      # base path, canonical/og URLs, robots.txt, sitemap.xml (and CNAME for a custom domain) all come from site.config.json
      # Same Supabase project as beta (VITE_SUPABASE_* secrets). No VITE_BETA / VITE_SUBPATH — this is the live root.
      - run: npm run build
        timeout-minutes: 8
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_AUTH: ${{ vars.VITE_GOOGLE_AUTH }}
          VITE_GOATCOUNTER: ${{ secrets.VITE_GOATCOUNTER }}
          VITE_OWNER_EMAILS: ${{ secrets.VITE_OWNER_EMAILS }}
      - name: Knowledge video previews (reuse the ones already cut for the site; never blocks a deploy)
        continue-on-error: true
        run: |
          sudo apt-get update -qq > /dev/null && sudo apt-get install -y -qq ffmpeg > /dev/null
          SITE=$(node -p "require('./site.config.json').siteUrl")
          curl -fsSL "${SITE}knowledge/posts.json" -o /tmp/posts.json || cp public/knowledge/posts.json /tmp/posts.json
          node scripts/make-previews.mjs --posts /tmp/posts.json --out dist/knowledge/previews --reuse "${SITE}beta/knowledge/previews/"
      - name: Service-worker version per deploy (returning visitors get the new app on refresh)
        run: |
          sed -i "s/^const VERSION = '\(d31-v[0-9.]*\)[^']*'/const VERSION = '\1-${GITHUB_SHA::7}'/" dist/sw.js
          grep -m1 "const VERSION" dist/sw.js
      - run: touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # keep /beta/ and /preview/ (and knowledge-sync files) instead of wiping them on every live deploy
          keep_files: true
